model: roberta-large
train_config:
  batch_size: 32
  micro_batch_size: 16
  max_length: 512
  lr: !!float 1e-4
  weight_decay: !!float 0.0
  warmup_ratio: !!float 0.03
  gradient_checkpointing: true
lora_config:
  rank: 16
  lora_alpha: 32
  lora_dropout: !!float 0.05
  # RoBERTa module names are query/value (BertSelfAttention), NOT q_proj/v_proj.
  # Do NOT use convert_target_modules from the original repo - it emits LLM names.
  target_modules: ["query", "value"]
  use_toplora: true
output_dir: ./results/roberta_large_r16
seed: 42
